<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Last Nightcap: a game about reasoning</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Special+Elite&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E6EBEE; --paper:#FFFFFF; --ink:#17202A; --muted:#55606B; --line:#C4CDD4;
  --abd:#6A4B9D; --ded:#1B6A64; --ind:#985709; --warn:#A3281D; --tag:#F2CF5B; --tag-ink:#3A2E00;
  --ui:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;
  --type:"Special Elite","Courier New",Courier,monospace;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#131920; --paper:#1D252E; --ink:#E4E9EE; --muted:#9BA7B3; --line:#34414E;
    --abd:#B7A0DF; --ded:#6FC4BB; --ind:#E3A64C; --warn:#F08A7E; --tag:#C9A83A; --tag-ink:#1D1600;
  }
}
:root[data-theme="dark"]{
  --bg:#131920; --paper:#1D252E; --ink:#E4E9EE; --muted:#9BA7B3; --line:#34414E;
  --abd:#B7A0DF; --ded:#6FC4BB; --ind:#E3A64C; --warn:#F08A7E; --tag:#C9A83A; --tag-ink:#1D1600;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 var(--ui);min-height:100%}
h1,h2,h3{line-height:1.2;margin:0 0 .5em}
h2{font-size:1.35rem} h3{font-size:1.08rem}
p{margin:0 0 .8em}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--abd);outline-offset:2px}
.muted{color:var(--muted)}
.small{font-size:.88rem}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--ink);color:var(--bg)}
.top-inner{max-width:1280px;margin:auto;padding:10px 16px;display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center}
.brand{font-family:var(--type);font-size:1.15rem;letter-spacing:.02em;margin-right:auto}
.hbtn{background:none;border:1px solid currentColor;color:inherit;border-radius:6px;padding:2px 10px;font-size:.85rem;cursor:pointer;opacity:.8}
.hbtn:hover{opacity:1}
.clock{font-variant-numeric:tabular-nums;font-weight:700}
.tabs{max-width:1280px;margin:auto;padding:0 16px;display:flex;gap:4px;overflow-x:auto}
.tab{background:none;border:0;color:inherit;opacity:.72;padding:8px 12px 10px;border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
.tab[aria-selected="true"]{opacity:1;border-bottom-color:var(--tag)}
.tab.log-tab{display:none}
.banner{max-width:1280px;margin:10px auto 0;padding:8px 16px}
.banner div{background:var(--paper);border-left:5px solid var(--warn);padding:8px 12px}

/* layout */
.shell{max-width:1280px;margin:auto;padding:16px;display:grid;grid-template-columns:minmax(0,1fr) 390px;gap:20px;align-items:start}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:18px}
aside.panel{position:sticky;top:calc(env(safe-area-inset-top,0px) + 110px);max-height:calc(100vh - 130px);overflow:auto}
@media (max-width:1000px){
  .shell{grid-template-columns:minmax(0,1fr)}
  aside.panel{position:static;max-height:none;display:none}
  body[data-tab="log"] aside.panel{display:block}
  body[data-tab="log"] .main-col{display:none}
  .tab.log-tab{display:inline-block}
}
.stack>*+*{margin-top:16px}

/* controls */
.btn{border:1px solid var(--ink);background:var(--paper);padding:.42em .9em;border-radius:6px;cursor:pointer}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--ink);color:var(--paper)}
.btn.quiet{border-color:var(--line)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
label.field{display:block;margin:0 0 12px}
label.field>span{display:block;font-weight:700;margin-bottom:4px}
input[type=text],select,textarea{width:100%;padding:.5em .6em;border:1px solid var(--line);border-radius:6px;background:var(--bg)}
textarea{min-height:5.2em;resize:vertical}
.hint{font-size:.88rem;color:var(--muted);margin-top:3px}
.choice{display:flex;gap:10px;align-items:flex-start;padding:10px;border:1px solid var(--line);border-radius:6px;margin-bottom:8px;cursor:pointer}
.choice input{margin-top:5px}

/* start */
.start{max-width:760px;margin:24px auto;padding:0 16px}
.start h1{font-family:var(--type);font-size:clamp(2rem,6vw,3.2rem);font-weight:400;margin-bottom:.2em}
.lede{font-size:1.1rem;max-width:62ch}
ol.cycle{padding-left:1.3em;margin:0 0 1em}
ol.cycle li{margin-bottom:.35em}
.progress{height:8px;background:var(--bg);border-radius:4px;overflow:hidden;margin:8px 0}
.progress>div{height:100%;background:var(--ded);width:0}

/* inference colours */
.t-hyp{--c:var(--abd)} .t-pred{--c:var(--ded)} .t-test{--c:var(--ind)}
.kind{color:var(--c);font-weight:700}

/* documents */
.files{list-style:none;padding:0;margin:0;display:grid;gap:8px}
.file{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:10px 12px;cursor:pointer}
.file[disabled]{cursor:default;opacity:.62}
.code{font-family:var(--type);background:var(--tag);color:var(--tag-ink);padding:2px 8px 2px 12px;clip-path:polygon(8px 0,100% 0,100% 100%,8px 100%,0 50%);min-width:3.4em;text-align:center}
.file .meta{font-size:.85rem;color:var(--muted)}
.new-dot{width:9px;height:9px;border-radius:50%;background:var(--warn);margin-left:auto;flex:none}
.sheet{position:relative;background:var(--paper);border:1px solid var(--line);padding:26px 24px 22px;font-family:var(--type);white-space:pre-wrap;line-height:1.6;max-width:72ch;box-shadow:3px 3px 0 var(--line)}
.sheet .code{position:absolute;top:-12px;right:18px}
.sheet h3{font-family:var(--type);font-weight:400;font-size:1.15rem;white-space:normal}
.facts{list-style:none;padding:0;margin:0}
.facts li{padding:8px 0;border-top:1px solid var(--line)}
.rumour{font-style:italic}

/* interviews */
.people{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-bottom:14px}
.person{border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:8px 10px;text-align:left;cursor:pointer}
.person[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.person b{display:block}
.chat{border:1px solid var(--line);border-radius:6px;padding:12px;max-height:52vh;overflow:auto;background:var(--bg)}
.msg{margin:0 0 10px;max-width:88%}
.msg.q{margin-left:auto;text-align:right}
.msg .who{font-size:.8rem;color:var(--muted)}
.msg .bubble{display:inline-block;padding:8px 11px;border-radius:8px;background:var(--paper);border:1px solid var(--line);text-align:left}
.msg.q .bubble{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.chip{border:1px dashed var(--line);background:none;border-radius:14px;padding:3px 10px;font-size:.88rem;cursor:pointer}

/* log */
.entry{border-left:5px solid var(--c);background:var(--bg);padding:8px 10px;margin-bottom:8px;border-radius:0 6px 6px 0}
.entry .head{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;font-size:.85rem}
.entry.rejected .text{text-decoration:line-through;color:var(--muted)}
.entry .link{font-size:.85rem;color:var(--muted)}
.addbar{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:10px 0}
.addbar .btn{border-color:var(--c);color:var(--c);font-weight:700;padding:.4em .3em}
.next{font-size:.9rem;background:var(--bg);border:1px dashed var(--line);padding:8px 10px;border-radius:6px}
.ev{max-height:180px;overflow:auto;border:1px solid var(--line);border-radius:6px;padding:6px 8px;background:var(--paper)}
.ev label{display:flex;gap:6px;font-size:.9rem;margin:3px 0}

.entry .text{white-space:pre-line}
textarea.short{min-height:3.2em}
.linkbtn{background:none;border:0;padding:0;color:var(--abd);text-decoration:underline;cursor:pointer;font-size:inherit}
.guide{max-width:78ch}
.guide h3{margin-top:1.4em}
.guide ul{padding-left:1.2em}
.guide li{margin-bottom:.5em}
.example{background:var(--bg);border-left:4px solid var(--abd);padding:10px 14px;margin:10px 0;border-radius:0 6px 6px 0}
.example p{margin:.4em 0}
dialog{border:0;border-radius:10px;padding:0;max-width:min(620px,94vw);background:var(--paper);color:var(--ink)}
dialog::backdrop{background:rgba(10,14,20,.6)}
.dlg{padding:22px;border-top:8px solid var(--c)}
.dlg .research{border-left:3px solid var(--line);padding-left:12px}
@media (prefers-reduced-motion:no-preference){ .msg{animation:rise .18s ease-out} @keyframes rise{from{opacity:0;transform:translateY(4px)}} }
</style>
</head>

// Refill times for the 30 nights before the murder (26 Aug to 24 Sep).
const REFILLS = ["22:31","22:28","22:35","22:30","22:33","22:24","22:29","22:32","22:36","22:30","22:27","22:34","22:31","22:41","22:29","22:30","22:33","22:28","22:35","22:32","22:30","22:26","22:34","22:31","22:29","22:38","22:30","22:33","22:27","22:32"];
function refillLog(){
  const d = new Date(2026,7,26), out = [];
  const wd = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"], mo = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  REFILLS.forEach(t => { out.push(`${wd[d.getDay()]} ${String(d.getDate()).padStart(2," ")} ${mo[d.getMonth()]}   ${t}   P.H.`); d.setDate(d.getDate()+1); });
  out.push("Fri 25 Sep   22:00   P.H.");
  return "Kragsholm Manor housekeeping log\nStudy: cognac decanter refilled (time written by the person refilling)\n\n" + out.join("\n");
}

// tier 0 = available from the start; 1 = needs a hypothesis and a linked prediction;
// 2 = needs two hypotheses and at least one recorded test; "event" = released by the event code.
const DOCS = [
 { id:"D_SCENE", code:"E1", tier:0, title:"Scene report", text:
`Kragsholm Manor, Funen. Friday 25 September.

23:30  Peter Holm, estate manager, enters the study in the east wing to bring Viktor Lund his usual evening tea. He finds Lund (64), chair of the Lund Foundation, collapsed in his armchair, barely conscious, with a very slow and irregular pulse. Ambulance called 23:33. Lund died in hospital at 02:40 on Saturday.

On the side table: a cognac glass, about one third full, and the crystal decanter, about half full.

Toxicology: very high concentrations of digoxin in the glass and in the small crystal decanter. One glass from the decanter would be a dangerous overdose for anyone, and more so for a heart patient already taking the drug. Lund was prescribed digoxin tablets for a heart condition. The hospital measured a level in his blood many times above the therapeutic range.

Marianne Lund states that she poured herself a small cognac from the same decanter at about 22:34 and took it to her room. She has no symptoms.

According to his wife and the manager, Lund took a nightcap in the study shortly after 23:00 every night.` },
 { id:"D_GUESTS", code:"E2", tier:0, title:"The house and the people in it", text:
`Kragsholm Manor is the Lund family home. It also hosts the Lund Foundation's meetings. The annual grant meeting was due to start on Saturday at 09:00.

In the house on Friday night:
Viktor Lund, chair of the foundation.
Marianne Lund, his wife.
Jonas Brink, director of the foundation. Guest wing.
Selma Akhtar, researcher, invited to present her appeal against the rejection of her grant application. Guest wing.
Peter Holm, estate manager. Hired for the evening: a bartender, a terrace waiter, a cloakroom attendant.

The study has an electronic lock. It opens with Viktor's card, Marianne's card, the spare Lund card or a staff card, and every entry is logged. Guest cards do not open it.

The hall connects the bar, the cloakroom and the east-wing corridor to the study. The terrace is reached through the bar.

Evening: dinner 19:30 to 21:30 (several people heard Viktor Lund and Selma Akhtar argue), then the bar and the terrace. According to the staff, Viktor Lund fetched papers from the study after dinner and read them in the drawing room until he went out to the terrace.` },
 { id:"D_LAB", code:"E3", tier:1, bridge:"BC_VALID", title:"Lab report: Marianne Lund's glass", text:
`Item: cognac glass from the nightstand in the Lund bedroom. Identified by Marianne Lund as the glass she filled at about 22:34. About half the contents remain. Fingerprints: Marianne Lund only.

Result: no digoxin detected. The detection limit is far below a harmful dose.

The decanter was tested again: same result as the scene report.` },
 { id:"D_KEY_TONIGHT", code:"E4", tier:1, title:"Study door log, Friday", text:
`Study door, east wing. Friday 25 September.
Entries only. Exits are not logged.

19:24  V. Lund (own card)
21:36  V. Lund (own card)
22:31  Staff card: P. Holm
22:34  M. Lund (own card)
22:48  Spare Lund card
23:07  V. Lund (own card)
23:30  Staff card: P. Holm` },
 { id:"D_PILLS", code:"E5", tier:1, title:"Viktor Lund's medication", text:
`Found in the bathroom of the Lund bedroom: digoxin 250 microgram tablets. 100 tablets dispensed on 14 September by the pharmacy in Faaborg. Dose: one tablet each morning.

Taken as prescribed from 15 September, 89 tablets should have been left on the evening of 25 September.

Tablets in the bottle: 49.

Marianne Lund states that the bottle has stood in the bathroom since it arrived. She did not collect it from the pharmacy.` },
 { id:"D_BAR", code:"E6", tier:1, title:"Bar receipts and bartender's statement", text:
`Receipts, Friday evening. Bar open from 21:30.
21:42  J. Brink, gin and tonic
21:50  S. Akhtar, glass of white wine
22:05  M. Lund, sparkling water
22:41  J. Brink, gin and tonic
23:02  J. Brink, espresso

Bartender: "Mr Brink was at the bar most of the evening. Around quarter to eleven he said he had to make a call and went out into the hall. He came back just before eleven and ordered an espresso. Ms Akhtar went out to the terrace at about twenty to eleven. Mrs Lund left the bar at about half past ten."` },
 { id:"D_HOUSE", code:"E7", tier:2, bridge:"BC_INDUCT", title:"Housekeeping log: decanter refills", text: refillLog() },
 { id:"D_KEY_MONTH", code:"E8", tier:2, title:"Study door, last 30 nights (summary)", text:
`Summary from the security contractor. Study door, 26 August to 24 September.

Evenings after 22:00:
M. Lund: entries between 22:15 and 22:45 on 26 of 30 nights. Typical time 22:32.
V. Lund: entries between 22:55 and 23:15 on 28 of 30 nights.
Staff card, P. Holm: between 22:24 and 22:41 on all 30 nights. Again between 23:25 and 23:35 on 27 nights.
Spare Lund card: none.
Other cards: none.

Spare Lund card, all hours: one entry, Thursday 24 September at 14:12. Before that, last used on 3 May.` },
 { id:"D_EXPENSE", code:"E9", tier:2, title:"Foundation expense claims, September (extract)", text:
`Claimant: Jonas Brink, director.

08 Sep  Train Copenhagen to Odense, board preparation          312 kr
14 Sep  Taxi, Kragsholm to Faaborg pharmacy and back,
        "errand for V. Lund (prescription)"                     486 kr
18 Sep  Lunch meeting with external auditor. Cancelled by J.B.    0 kr
22 Sep  Printing of meeting folders                           1,940 kr` },
 { id:"D_EMAIL", code:"E10", tier:2, title:"Unsent draft on Viktor Lund's laptop", text:
`Saved Friday 25 September, 18:52. Not sent.

To: Board members, Lund Foundation
Subject: An item for tomorrow

Dear colleagues,
Tomorrow I will add one item to the agenda: an internal review of how our grants for 2024 and 2025 were reported. The figures in our accounts do not match what our partners say they received. On 8 September I asked Jonas for the partner statements behind these figures. I have still not received them. I have not yet told the staff what I found, because I want the board to hear it first. Please treat this as confidential until then.

Viktor` },
 { id:"D_TERRACE", code:"E11", tier:2, title:"Terrace waiter's statement", text:
`"Mr Lund came out onto the terrace at about twenty to eleven. Ms Akhtar was already there, smoking. They talked the whole time, calmly, nothing like at dinner. I brought him a glass of water at about ten to eleven. He went back in at eleven, maybe a minute after. Nobody else came out while they were there."` },
 { id:"D_COAT", code:"E12", tier:"event", title:"New evidence: the spare card", text:
`Saturday, 10:15. Clearing the cloakroom this morning, the attendant finds a keycard in the pocket of Marianne Lund's coat.

It is the spare Lund card for the study.

Marianne Lund's coat has hung in the cloakroom since she came home at 19:10.` },
 { id:"D_CLOAK", code:"E13", tier:"event", title:"Cloakroom attendant's statement", text:
`"It was busy until about half past seven, then quiet. Mrs Lund never came back for her coat. After ten o'clock only one person came to the coats: Mr Brink, at about five to eleven. He said he wanted his scarf and took it from the rack himself. The coats hang close together. I didn't see him go outside."` }
];

const BRIDGES = {
 BC_VALID: { kind:"pred", title:"Valid is not the same as sound",
   text:"A clean glass seems to show that the decanter was harmless at 22:34, so the poison went in later. That conclusion follows necessarily, but only if the premises hold: that this is the glass she filled, that the test is reliable, that she poured it from the decanter when she says. Notice also exactly what follows: after she poured, not after she left.",
   research:"In research design, deduction is how you derive expectations from a theory. The derivation can be flawless and the conclusion still wrong if a premise fails, for example how a concept was operationalised or measured.",
   question:"Which premise behind this deduction would you check first, and how?" },

   text:"On 30 nights in a row the decanter was refilled between 22:24 and 22:41. Concluding that last night's refill also happened around 22:30 is induction: a generalisation from observed cases to an unobserved one. It can be strong, but it is never certain.",
   research:"The same move underlies generalising from a sample or from cases. Its strength depends on how many cases there are, how they were selected, and whether the new case belongs to the same population.",
   question:"Was last night an ordinary night in the sense that matters here? What would make the pattern a poor guide?" },
 BC_ABDUCT: { kind:"hyp", title:"More than one explanation",
   text:"Peirce called abduction \u201cthe process of forming an explanatory hypothesis\u201d and the only inference that introduces a new idea (Collected Papers 5.171\u2013172). It is also the weakest: several hypotheses can make the same surprising fact unsurprising.",
   research:"Qualitative researchers reason abductively when a finding does not fit existing theory (Timmermans and Tavory 2012). The design question is how to choose between rival explanations, which means finding where they predict different things.",
   question:"Name one observation where your two hypotheses predict different things." },
 BC_CONFIRM: { kind:"test", title:"Evidence that fits too well",

   question:"If Marianne put the card there, what else should you find? Do you find it?" }

const CHARACTERS = [
 { id:"marianne", name:"Marianne Lund", role:"Viktor's wife, 58",

/* =====================================================================

   ===================================================================== */
const TEST = new URLSearchParams(location.search).has("test");
const $ = (s, r=document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const TIME_RE = /\b([01]?\d|2[0-3])[:.]([0-5]\d)\b/g;
const times = t => [...String(t).matchAll(TIME_RE)].map(m => m[1].padStart(2,"0")+":"+m[2]);
const KIND = { hyp:"Hypothesis", pred:"Prediction", test:"Test" };
const KIND_INF = { hyp:"abduction", pred:"deduction", test:"induction" };
const GLOBAL_FORBIDDEN = [/\b(i|we) (killed|murdered|poisoned)\b/i, /\bthe (murderer|killer) (is|was)\b/i, /\b(as an ai|language model|this game|role-?play)\b/i];
const PROTECTED = /digoxin|pill|tablet|medic|card|key|decanter|cognac|glass|poison|study|log\b|murder|kill|scarf|coat|cloak|pharmac|prescri|audit|money|grant|email|terrace|\bbar\b|\d/i;

let state = load();
let ui = { tab:"guide", doc:null, char:"marianne", form:null, busy:false, bridgeQueue:[], err:"" };
let webllm = null, engine = null, loading = null;

function load(){ try { const s = localStorage.getItem(CONFIG.storageKey); return s ? JSON.parse(s) : null; } catch(e){ return null; } }
function save(){ try { localStorage.setItem(CONFIG.storageKey, JSON.stringify(state)); } catch(e){} }
function fresh(team, mode, modelId){
  return { v:1, team, mode, modelId, startedAt:Date.now(), docsOpened:{}, testimonies:{}, log:[], bridge:{},
           eventUnlocked:false, chats:{}, emergent:[], submitted:null, seq:1, testUnlock:false };
}

function counts(){
  const L = state.log;
  return { h:L.filter(e=>e.type==="hyp").length,
           p:L.filter(e=>e.type==="pred" && e.link).length,
           t:L.filter(e=>e.type==="test" && e.link).length };
}
function tier(){ if (state.testUnlock) return 2; const c = counts(); const t1 = c.h>=1 && c.p>=1; return t1 && c.t>=1 && c.h>=2 ? 2 : t1 ? 1 : 0; }
function met(req){
  if (!req) return true;
  if (req.tier && tier() < req.tier) return false;
  if (req.event && !state.eventUnlocked) return false;
  if (req.docs && !req.docs.every(d => state.docsOpened[d])) return false;
  return true;
}
function docAvailable(d){ return d.tier === "event" ? state.eventUnlocked : tier() >= d.tier; }
function tierNeed(t){
  return t === 1 ? "Record a hypothesis and a prediction that follows from it."
       : t === 2 ? "Record a second hypothesis and at least one test of a prediction."
       : "Released during the session.";
}
function elapsedMin(){ return (Date.now() - state.startedAt) / 60000; }

/* ---------- rendering ---------- */
function render(){
  const root = $("#root");
  if (!state){ root.innerHTML = startView(); bindStart(); return; }
  document.body.dataset.tab = ui.tab;
  root.innerHTML = `
  <header class="top">
    <div class="top-inner">
      <div class="brand">${esc(CONFIG.title)}</div>
      <span>${esc(state.team)}</span>
      <span class="clock" id="clock"></span>
      <span class="small">${state.mode==="ai" ? (engine ? "AI characters" : "AI not loaded") : "Scripted characters"}</span>
      <button class="hbtn" id="newgamebtn">Start a new game</button>
    </div>
    <nav class="tabs" role="tablist">
      ${[["guide","Method guide"],["files","Case files"],["people","Interviews"],["log","Inquiry log"],["final","Final argument"]].map(([k,l]) =>
        `<button class="tab ${k==="log"?"log-tab":""}" role="tab" aria-selected="${ui.tab===k}" data-tab="${k}">${l}</button>`).join("")}
    </nav>
  </header>
  <div id="banner"></div>
  ${state.mode==="ai" && !engine ? reloadBar() : ""}
  ${TEST ? testBar() : ""}
  <div class="shell">
    <section class="main-col stack">${ui.tab==="people" ? peopleView() : ui.tab==="final" ? finalView() : ui.tab==="guide" ? guideView() : filesView()}</section>
    <aside class="panel">${logView()}</aside>
  </div>`;
  bindGame();
  tick();
}

function startView(){
  const gpu = !!navigator.gpu;
  return `<div class="start stack">
    <h1>${esc(CONFIG.title)}</h1>
    <p class="lede">A murder at a manor on Funen, and a rule: you may only ask for evidence by reasoning your way to it.</p>
    <div class="panel">
      <h2>How the game works</h2>
      <ol class="cycle">
        <li>Read the scene report. Find what is surprising and propose an explanation that names a person, a motive and a mechanism: how and when it was done. That is <span class="t-hyp kind">abduction</span>.</li>
        <li>Work out what else must be true if the explanation is right. That is <span class="t-pred kind">deduction</span>. A hypothesis plus a prediction releases new files.</li>
        <li>Check predictions against the evidence and record what you found. Generalising from patterns in the evidence is <span class="t-test kind">induction</span>.</li>
        <li>Revise, add rival explanations and repeat. A second hypothesis and a recorded test release the rest of the files.</li>
      </ol>
      <p>You are assessed on the quality of your reasoning, not on naming the right person. A careful argument that turns out wrong can beat a lucky guess.</p>
      <p>The game opens on the <b>Method guide</b>. Read it as a team before you open the case files: it shows how to write a hypothesis you can test and how the game connects to research design.</p>
    </div>
    <div class="panel">
      <label class="field"><span>Team name</span><input type="text" id="team" maxlength="40" placeholder="e.g. Team 7"></label>
      <div class="field"><span style="font-weight:700;display:block;margin-bottom:6px">How the characters answer</span>
        <label class="choice"><input type="radio" name="mode" value="ai" ${gpu?"checked":"disabled"}>
          <span><b>AI characters in this browser</b><br><span class="small muted">${gpu ? "Downloads a small language model (about 1 to 2 GB) the first time. After that it is cached." : "This browser has no WebGPU support. Use a recent Chrome or Edge, or choose scripted characters."}</span></span></label>
        <label class="choice"><input type="radio" name="mode" value="scripted" ${gpu?"":"checked"}>
          <span><b>Scripted characters</b><br><span class="small muted">Fixed answers triggered by what you ask about. No download. Useful for testing or older laptops.</span></span></label>
      </div>
      <div id="modelbox"></div>
      <p class="small" id="starterr" style="color:var(--warn)"></p>
      <button class="btn primary" id="startbtn">Start the investigation</button>
    </div>
  </div>`;
}

async function populateModels(){
  const box = $("#modelbox"); if (!box) return;
  const mode = document.querySelector("input[name=mode]:checked")?.value;
  if (mode !== "ai"){ box.innerHTML = ""; return; }
  box.innerHTML = `<p class="small muted">Loading the list of models...</p>`;
  try {
    await loadLib();
    const list = webllm.prebuiltAppConfig.model_list;
    let opts = CONFIG.preferredModels.map(id => list.find(m => m.model_id === id)).filter(Boolean);
    if (!opts.length) opts = list.filter(m => /instruct/i.test(m.model_id) && (m.vram_required_MB||9e9) < 4500).slice(0,6);
    box.innerHTML = `<label class="field"><span>Model</span><select id="model">${opts.map(m =>
      `<option value="${esc(m.model_id)}">${esc(m.model_id)}${m.vram_required_MB ? ` (about ${Math.round(m.vram_required_MB/100)/10} GB)` : ""}</option>`).join("")}</select>
      <div class="hint">The first option usually gives the best characters. Pick a 1B or 1.5B model for weaker laptops.</div></label>
      <div class="progress" hidden><div></div></div><p class="small muted" id="progtext"></p>`;
  } catch(e){
    box.innerHTML = `<p class="small" style="color:var(--warn)">The in-browser AI library could not be loaded here (${esc(e.message||e)}). Choose scripted characters instead.</p>`;
  }
}
async function loadLib(){ if (!webllm) webllm = await import(CONFIG.webllmUrl); return webllm; }
async function startEngine(modelId, onProgress){
  await loadLib();
  try {
    engine = await webllm.CreateMLCEngine(modelId, { initProgressCallback: onProgress });
  } catch(e){
    // The browser's Cache storage sometimes fails. Retry once with IndexedDB storage instead.
    if (!/cache|network|quota|storage/i.test(String(e.message||e))) throw e;
    onProgress({ progress:0, text:"Download failed with the browser cache. Retrying with a different storage method..." });
    engine = await webllm.CreateMLCEngine(modelId, { initProgressCallback: onProgress,
      appConfig: { ...webllm.prebuiltAppConfig, useIndexedDBCache: true } });
  }
}
async function explainFailure(e, modelId){
  const msg = String(e.message||e);
  const parts = ["The model could not start (" + msg + ")."];
  let hfOk = true;
  try {
    const m = webllm?.prebuiltAppConfig.model_list.find(x => x.model_id === modelId);
    const base = (m?.model || "https://huggingface.co/mlc-ai/" + modelId).replace(/\/$/, "");
    const r = await fetch(base + "/resolve/main/mlc-chat-config.json", { cache:"no-store" });
    hfOk = r.ok;
  } catch(err){ hfOk = false; }
  if (!hfOk) parts.push("This laptop cannot reach huggingface.co, where the model is stored. The network, a VPN or an ad blocker is probably blocking it. Try another network, such as a phone hotspot, or switch off the blocker for this page.");
  else if (/quota|storage/i.test(msg)) parts.push("The browser has too little storage for the model. Free up disk space, and do not use a private window.");
  else parts.push("The download was interrupted. Check that you are not in a private window, that the laptop has a few GB of free disk space, and try again. A smaller model may also help.");
  parts.push("You can play with scripted characters in the meantime.");
  return parts.join(" ");
}

function bindStart(){
  document.querySelectorAll("input[name=mode]").forEach(r => r.addEventListener("change", populateModels));
  populateModels();
  $("#startbtn").addEventListener("click", async () => {
    const team = $("#team").value.trim();
    const mode = document.querySelector("input[name=mode]:checked")?.value;
    const err = $("#starterr");
    if (!team){ err.textContent = "Enter a team name first."; return; }
    if (!mode){ err.textContent = "Choose how the characters answer."; return; }
    let modelId = null;
    if (mode === "ai"){
      modelId = $("#model")?.value;
      if (!modelId){ err.textContent = "No model is available. Choose scripted characters."; return; }
      $("#startbtn").disabled = true;
      const bar = $(".progress"); bar.hidden = false;
      try {
        await startEngine(modelId, r => { bar.firstElementChild.style.width = Math.round((r.progress||0)*100)+"%"; $("#progtext").textContent = r.text || ""; });
      } catch(e){
        $("#startbtn").disabled = false;
        err.textContent = "Checking what went wrong...";
        err.textContent = await explainFailure(e, modelId);
        return;
      }
    }
    state = fresh(team, mode, modelId); save(); render();
  });
}

  return `<div class="banner"><div class="row"><span>The AI model is not loaded, so characters use scripted answers.</span>

  if (ui.doc){

    <h2>Start here</h2>
    <p><b>The surprising fact.</b> ${esc(OPENING)}</p>

  </div>
  <div class="panel">
    <h2>Evidence</h2>

function logView(){
  const c = counts(), t = tier();
  const need = t===0 ? "Next files: record a hypothesis, then a prediction linked to it."
             : t===1 ? `Next files: ${c.h<2?"a second hypothesis":""}${c.h<2&&c.t<1?" and ":""}${c.t<1?"a test of one of your predictions":""}.`
             : "All regular files are released.";
  const f = ui.form;
  return `<h2>Inquiry log</h2>
  <p class="small muted">Every step of your reasoning goes here. It is what you are assessed on. <button class="linkbtn" id="toguide">How to write a testable hypothesis</button></p>
  <div class="next">${esc(need)}</div>
  <div class="addbar">
    <button class="btn t-hyp" data-add="hyp">+ Hypothesis</button>
    <button class="btn t-pred" data-add="pred">+ Prediction</button>
    <button class="btn t-test" data-add="test">+ Test</button>
  </div>
  ${f ? formView(f) : ""}
  ${state.log.length ? state.log.slice().reverse().map(entryView).join("") : `<p class="muted small">No entries yet. Start with a hypothesis that would explain the surprising fact.</p>`}`;
}
function formView(f){
  const hyps = state.log.filter(e => e.type==="hyp"), preds = state.log.filter(e => e.type==="pred");
  const evidence = [...DOCS.filter(d => state.docsOpened[d.id]).map(d => [d.id, d.code+" "+d.title]),
                    ...Object.values(state.testimonies).map(x => [x.id, x.text.split(":")[0] + ": " + x.text.split(":").slice(1).join(":").slice(0,70) + "..."])];
  const prompts = {
    pred:"e.g. an entry in a log, a gap in an alibi, a missing object",
    test:"What did you find when you checked, and what does it show?"
  };
  let extra = "";
  if (f.type==="pred") extra = hyps.length ? `<label class="field"><span>Follows from</span><select id="f-link">${hyps.map(h => `<option value="${h.id}">H${h.n}: ${esc(h.text.slice(0,60))}</option>`).join("")}</select></label>`
                                            : `<p class="small" style="color:var(--warn)">Record a hypothesis first. A prediction has to follow from one.</p>`;
  if (f.type==="test") extra = preds.length ? `<label class="field"><span>Tests prediction</span><select id="f-link">${preds.map(p => `<option value="${p.id}">P${p.n}: ${esc(p.text.slice(0,60))}</option>`).join("")}</select></label>
      <div class="field"><span style="font-weight:700">Evidence used</span><div class="ev">${evidence.length ? evidence.map(([id,l]) => `<label><input type="checkbox" value="${id}" class="f-ev"> ${esc(l)}</label>`).join("") : `<span class="small muted">Read some files or interview someone first.</span>`}</div></div>
      <label class="field"><span>Result</span><select id="f-out"><option value="supports">Supports the prediction</option><option value="contradicts">Contradicts the prediction</option><option value="inconclusive">Inconclusive</option></select></label>`
                                            : `<p class="small" style="color:var(--warn)">Record a prediction first. A test checks a prediction.</p>`;
  const blocked = (f.type==="pred" && !hyps.length) || (f.type==="test" && !preds.length);
  let body;
  if (f.type==="hyp") body = `
    <label class="field"><span>Who</span><select id="h-who"><option value="">Choose...</option>${CHARACTERS.map(c => `<option>${esc(c.name)}</option>`).join("")}<option>More than one person</option><option>Someone else</option></select></label>
    <label class="field"><span>Motive</span><textarea class="short" id="h-motive" placeholder="Why would they do it?"></textarea></label>
    <label class="field"><span>Means</span><textarea class="short" id="h-means" placeholder="Where did the poison come from, and how did they get hold of it?"></textarea></label>
    <label class="field"><span>Opportunity</span><textarea class="short" id="h-opp" placeholder="When and how did they get to the decanter?"></textarea></label>
    <label class="field"><span>What it explains</span><textarea class="short" id="h-expl" placeholder="Why is the surprising fact no longer surprising if this is true?"></textarea></label>
    <p class="hint">The motive makes a hypothesis plausible. The means and the opportunity make it testable, so those two are required.</p>`;
  else if (f.type==="pred") body = `${extra}
    <label class="field"><span>If the hypothesis is true, we should find...</span><textarea id="f-text" placeholder="${esc(prompts.pred)}" ${blocked?"disabled":""}></textarea></label>
    <label class="field"><span>Where would it show?</span><select id="p-src" ${blocked?"disabled":""}><option>A document or record</option><option>A witness statement</option><option>A pattern over time (a log, a routine)</option><option>Physical evidence</option></select></label>
    <label class="field"><span>If we do not find it, what is in doubt?</span><textarea class="short" id="p-doubt" placeholder="The whole hypothesis, or one part of it: motive, means or opportunity?" ${blocked?"disabled":""}></textarea></label>
    <label class="choice"><input type="checkbox" id="p-disc" ${blocked?"disabled":""}><span class="small">This prediction tells two of our hypotheses apart: they expect different things here.</span></label>`;
  else body = `${extra}
    <label class="field"><span>What did you find?</span><textarea id="f-text" placeholder="${esc(prompts.test)}" ${blocked?"disabled":""}></textarea></label>
    <label class="field"><span>Does this rest on a pattern, such as a routine, a log over many days or several similar cases? If so, how far can it be trusted?</span><textarea class="short" id="t-pattern" placeholder="Leave empty if not" ${blocked?"disabled":""}></textarea></label>`;
  return `<div class="entry t-${f.type}"><div class="head"><span class="kind">${KIND[f.type]}</span><span class="muted">${KIND_INF[f.type]}</span></div>
    ${body}
    <p class="small" id="f-err" style="color:var(--warn)"></p>
    <div class="row"><button class="btn primary" id="f-save" ${blocked?"disabled":""}>Add to log</button><button class="btn quiet" id="f-cancel">Cancel</button></div></div>`;
}
function entryView(e){
  const link = e.link ? state.log.find(x => x.id === e.link) : null;
  const tag = x => (x.type==="hyp"?"H":x.type==="pred"?"P":"T") + x.n;
  const ev = (e.evidence||[]).map(id => DOCS.find(d => d.id===id)?.code || "statement").join(", ");
  return `<div class="entry t-${e.type} ${e.status==="rejected"?"rejected":""}">
    <div class="head"><span class="kind">${tag(e)} ${KIND[e.type]}</span><span class="muted">${KIND_INF[e.type]}</span>
      ${e.type==="test" ? `<span>${esc(e.outcome)}</span>` : ""}${e.disc ? `<span>distinguishes hypotheses</span>` : ""}
      ${e.type==="hyp" ? `<select data-status="${e.id}" aria-label="Status of ${tag(e)}" style="width:auto;margin-left:auto;padding:1px 4px;font-size:.82rem">
         ${["open","favoured","rejected"].map(s => `<option ${e.status===s?"selected":""}>${s}</option>`).join("")}</select>` : ""}</div>
    ${link ? `<div class="link">${e.type==="pred"?"from":"tests"} ${tag(link)}</div>` : ""}
    <div class="text">${esc(e.text)}</div>
    ${ev ? `<div class="link">Evidence: ${esc(ev)}</div>` : ""}</div>`;
}

function guideView(){
  return `<div class="panel guide">
  <h2>Method guide</h2>
  <p>This game trains the same reasoning you will use in your own research design. Read sections 1 to 3 as a team before you open the case files. Section 5 shows how each step carries over to social science research. You can come back to this guide at any time.</p>

  <h3 id="g-hyp">1. Writing a hypothesis you can test</h3>
  <p>A hypothesis about a crime, like one about a social phenomenon, has to say more than who did it and why. A motive tells you that someone had a reason. It leaves few traces. What leaves traces is the mechanism: how the act was actually carried out. A testable hypothesis therefore names four things:</p>
  <ul>
    <li><b>A person.</b> Who acted. Without a named actor you cannot check anyone's movements, access or alibi.</li>
    <li><b>A motive.</b> Why they would do it. This makes the hypothesis plausible, but on its own it predicts very little.</li>
    <li><b>A mechanism.</b> The means (where the poison came from and how the person got it) and the opportunity (when and how they reached the decanter). This is the part that produces predictions: entries in logs, missing objects, gaps in alibis.</li>
    <li><b>What it explains.</b> Why the surprising fact is no longer surprising if the hypothesis is true.</li>
  </ul>
  <p>The more specific the mechanism, the more follows from it and the easier it is to test. The price is that a very specific hypothesis is more likely to be wrong in some detail. That is a good trade: a hypothesis that cannot be wrong cannot be tested either.</p>
  <p>Be careful with rescues. When a fact does not fit and you add an extra assumption to save your hypothesis (an accomplice, a secret affair, a lie told for someone), the addition needs evidence of its own. Otherwise you have made the hypothesis harder to refute without making it better supported.</p>

  <h3 id="g-pred">2. Deriving predictions</h3>
  <p>A prediction is what must also be true if the hypothesis is true. Use the frame: <i>If [hypothesis], then we should find [observation] in [kind of source]. If we do not, [which part] is in doubt.</i></p>
  <p>A useful prediction could turn out false. The most useful ones are those where two of your hypotheses expect different things, because then one observation can tell them apart. Also note what your deduction rests on: a conclusion can follow perfectly from its premises and still be wrong if a premise is.</p>

  <h3 id="g-test">3. Testing</h3>
  <p>Record what you actually found and whether it supports or contradicts the prediction. When your test relies on a pattern, such as a routine, a log over many days, or several similar cases, you are reasoning inductively: from observed cases to one you did not observe. Ask how strong that pattern is and whether this case belongs to it.</p>
  <p>Tests differ in strength (Van Evera 1997; Collier 2011). A <b>hoop test</b> checks a necessary condition: the culprit must have been able to reach the decanter. Failing it eliminates a hypothesis, but passing it proves little, since several people pass. A <b>smoking-gun test</b> checks something that strongly confirms if found, such as incriminating evidence in someone's possession. Not finding it does not eliminate anyone. And smoking guns can be planted.</p>

  <h3 id="g-ex">4. A worked example from outside the case</h3>
  <div class="example">
  <p><b>Surprising fact.</b> A project group's shared folder was deleted on Friday at 20:40. Nobody admits it.</p>
  <p><b>H1.</b> Anna. Motive: she disagreed with the group's analysis. Means: her own login. Opportunity: she was working online on Friday evening. Explains: the deletion happened at a time when she was active.</p>
  <p><b>H2.</b> No person: a synchronisation error in the cloud service.</p>
  <p><b>P1, from H1.</b> If Anna deleted it, the server log should show the deletion from her account at 20:40. If not, the means part of H1 fails.</p>
  <p><b>P2, telling H1 and H2 apart.</b> If it was a sync error, other folders synced at the same time should also be damaged. H1 predicts that only this folder is affected.</p>
  <p><b>T1, testing P2.</b> Only this folder was affected: supports H1 over H2. But the service's history shows sync errors on 3 of the last 50 syncs, always affecting single folders. That pattern (induction) weakens the test: a single-folder loss is also what H2 would produce.</p>
  </div>

  <h3 id="g-research">5. From the manor to your research design</h3>
  <p>Each step in the game has a counterpart in social science research:</p>
  <ul>
    <li><b>The surprising fact</b> is your research puzzle: something that existing explanations do not account for. Starting from it and proposing an explanation is abduction (Peirce, Collected Papers 5.171; Timmermans and Tavory 2012).</li>
    <li><b>Person, motive and mechanism</b> correspond to actors, their interests, and the causal mechanism that links a cause to an outcome. Social science explanations are stronger when they specify how an outcome is produced, not only which factors are associated with it (Hedstr\u00f6m and Ylikoski 2010).</li>
    <li><b>Predictions</b> are the observable implications of your theory: what you should see in your data if the theory holds (King, Keohane and Verba 1994, ch. 1). A theory with no observable implications cannot be tested.</li>
    <li><b>Tests</b> are your analysis. Hoop and smoking-gun tests are standard tools in process tracing (Collier 2011; Beach and Pedersen 2019).</li>
    <li><b>Induction</b> is generalising from your cases, interviews or sample. Its strength depends on how many cases you have, how they were selected, and whether the new case belongs to the same population.</li>
    <li><b>Rescues</b> are the auxiliary assumptions researchers add when data do not fit a favoured theory. They can be legitimate, but only if they are tested in turn.</li>
  </ul>
  <div class="example">
  <p><b>An example.</b> Participation in a municipality's co-creation process for a local climate plan fell sharply after the second workshop.</p>
  <p><b>Weak hypothesis:</b> citizens lost interest. It names no actor or mechanism, so almost any data fit it.</p>
  <p><b>Specific hypothesis:</b> at the second workshop the municipality presented a finished draft plan (mechanism), which signalled that decisions had already been made, so citizens who had joined to influence the plan (actors and motive) stopped coming.</p>
  <p><b>Predictions:</b> attendance should fall after the draft was presented, not before. People who dropped out should mention lack of influence in interviews. Participants who came for other reasons, such as meeting neighbours, should be more likely to stay. <b>Rival:</b> the workshops clashed with the holidays. That predicts a similar drop in other municipal meetings the same month, which is a test that tells the two apart.</p>
  </div>
  <h3>References</h3>
  <p class="small">Beach, D. and Pedersen, R. B. (2019) <i>Process-Tracing Methods: Foundations and Guidelines</i>, 2nd edn. University of Michigan Press.<br>
  Collier, D. (2011) Understanding process tracing. <i>PS: Political Science and Politics</i> 44(4), 823\u2013830.<br>
  Hedstr\u00f6m, P. and Ylikoski, P. (2010) Causal mechanisms in the social sciences. <i>Annual Review of Sociology</i> 36, 49\u201367.<br>
  King, G., Keohane, R. O. and Verba, S. (1994) <i>Designing Social Inquiry</i>. Princeton University Press.<br>
  Peirce, C. S. (1931\u20131958) <i>Collected Papers</i>, vol. 5. Harvard University Press.<br>
  Timmermans, S. and Tavory, I. (2012) Theory construction in qualitative research: from grounded theory to abductive analysis. <i>Sociological Theory</i> 30(3), 167\u2013186.<br>
  Van Evera, S. (1997) <i>Guide to Methods for Students of Political Science</i>. Cornell University Press.</p>
  <div class="row" style="margin-top:18px"><button class="btn primary" id="tofiles">Open the case files</button></div>
  </div>`;
}

function finalView(){
  if (state.submitted){
    const json = JSON.stringify(state.submitted, null, 1);
    return `<div class="panel"><h2>Final argument submitted</h2>
      <p>Your lecturer will reveal the solution in the plenary. Until then, keep your reasoning to your own team.</p>
      <p class="small muted">${CONFIG.googleForm.action ? "It was also sent to your lecturer's collection form. " : ""}If your lecturer asks for a file, download it here. If downloading does not work, copy the text below.</p>
      <div class="row"><button class="btn primary" id="dl">Download file</button><button class="btn quiet" id="copy">Copy text</button><span class="small" id="copymsg"></span></div>
      <textarea readonly style="margin-top:10px;min-height:8em;font-size:.8rem" id="payload">${esc(json)}</textarea></div>`;
  }
  const f = (id, label, hint) => `<label class="field"><span>${label}</span><textarea id="${id}"></textarea><div class="hint">${hint}</div></label>`;
  return `<div class="panel">
    <h2>Final argument</h2>
    <p class="small muted">This is assessed on how well the reasoning holds up, including how honestly you state what you cannot show.</p>
    <label class="field"><span>Who do you accuse?</span><select id="acc"><option value="">Choose...</option>${CHARACTERS.map(c => `<option>${esc(c.name)}</option>`).join("")}<option>Undecided</option></select></label>
    ${f("a-hyp","Your explanation","Abduction: what happened, and why does it make the surprising fact unsurprising?")}
    ${f("a-ded","What follows if it is true","Deduction: the predictions you derived, and the premises they rest on.")}
    ${f("a-ind","How the evidence tested it","Induction and testing: which evidence you checked, what patterns you relied on, and how far they can be trusted.")}
    ${f("a-alt","Rival explanations","Which alternatives did you consider, and what evidence tells them apart from yours?")}
    ${f("a-unc","What remains uncertain","What would change your mind? What could you not rule out?")}
    <label class="field"><span>Confidence</span><select id="conf"><option value="1">1: a guess</option><option value="2">2: weak</option><option value="3" selected>3: moderate</option><option value="4">4: strong</option><option value="5">5: beyond reasonable doubt</option></select></label>
    <p class="small" id="finerr" style="color:var(--warn)"></p>
    <button class="btn primary" id="submit">Submit final argument</button>
  </div>`;
}

/* ---------- events ---------- */
function bindGame(){
  document.querySelectorAll(".tab[data-tab]").forEach(b => b.onclick = () => { ui.tab = b.dataset.tab; ui.doc = null; render(); scrollTo(0,0); });
  document.querySelectorAll("[data-doc]").forEach(b => b.onclick = () => openDoc(b.dataset.doc));
  $("#back") && ($("#back").onclick = () => { ui.doc = null; render(); });
  $("#codebtn") && ($("#codebtn").onclick = () => {
    const v = $("#code").value.trim().toUpperCase();
    if (v === CONFIG.eventCode.toUpperCase()) unlockEvent();
    else $("#codemsg").textContent = "That code is not right. Check it with your lecturer.";
  });
  document.querySelectorAll("[data-char]").forEach(b => b.onclick = () => { ui.char = b.dataset.char; render(); scrollChat(); });
  document.querySelectorAll("[data-chip]").forEach(b => b.onclick = () => { const q = $("#q"); q.value = `Tell me about ${b.dataset.chip.toLowerCase()}.`; q.focus(); });
  $("#ask") && ($("#ask").onsubmit = ev => { ev.preventDefault(); const q = $("#q").value.trim(); if (q && !ui.busy) ask(ui.char, q); });
  document.querySelectorAll("[data-add]").forEach(b => b.onclick = () => { ui.form = { type:b.dataset.add }; render(); $("#f-text")?.focus(); });
  $("#f-cancel") && ($("#f-cancel").onclick = () => { ui.form = null; render(); });
  $("#newgamebtn") && ($("#newgamebtn").onclick = confirmNewGame);
  $("#tofiles") && ($("#tofiles").onclick = () => { ui.tab = "files"; ui.doc = null; render(); scrollTo(0,0); });
  $("#toguide") && ($("#toguide").onclick = () => { ui.tab = "guide"; ui.doc = null; render(); scrollTo(0,0); });
  $("#f-save") && ($("#f-save").onclick = saveEntry);
  document.querySelectorAll("[data-status]").forEach(s => s.onchange = () => { const e = state.log.find(x => x.id===s.dataset.status); e.status = s.value; save(); render(); });
  $("#submit") && ($("#submit").onclick = submitFinal);
  $("#dl") && ($("#dl").onclick = download);
  $("#copy") && ($("#copy").onclick = async () => { try { await navigator.clipboard.writeText($("#payload").value); $("#copymsg").textContent = "Copied."; } catch(e){ $("#payload").select(); $("#copymsg").textContent = "Select all and copy manually."; } });
  $("#reload") && ($("#reload").onclick = async () => {
    $("#reload").disabled = true;
    try { await startEngine(state.modelId, r => { $("#reloadtext").textContent = r.text || ""; }); render(); }
    catch(e){ $("#reloadtext").textContent = await explainFailure(e, state.modelId); $("#reload").disabled = false; }
  });
  if (TEST){
    $("#t-unlock").onclick = () => { state.testUnlock = !state.testUnlock; save(); render(); };
    $("#t-event").onclick = () => { if (!state.eventUnlocked) unlockEvent(); };
    $("#t-reset").onclick = () => { if (confirm("Delete this team's progress on this device?")){ try{ localStorage.removeItem(CONFIG.storageKey); }catch(e){} state = null; render(); } };
  }
  if (ui.tab === "people") scrollChat();
}
const scrollChat = () => { const c = $("#chat"); if (c) c.scrollTop = c.scrollHeight; };

function confirmNewGame(){
  const dlg = $("#newgame");
  dlg.innerHTML = `<div class="dlg" style="--c:var(--warn)">
    <h2>Start a new game?</h2>
    <p>This deletes everything ${esc(state.team)} has done on this laptop: the inquiry log, notes, interviews, bridge-card answers${state.submitted ? " and the submitted final argument" : ""}. It cannot be undone.</p>
    ${state.submitted ? `<p><b>You have submitted a final argument.</b> If your lecturer needs the file, download it from the Final argument tab first.</p>` : ""}
    <label class="field"><span>Type the team name, ${esc(state.team)}, to confirm</span><input type="text" id="ng-name" autocomplete="off"></label>
    <div class="row"><button class="btn primary" id="ng-yes" disabled>Delete and start again</button><button class="btn quiet" id="ng-no">Keep playing</button></div></div>`;
  dlg.showModal();
  const inp = $("#ng-name"), yes = $("#ng-yes");
  inp.oninput = () => yes.disabled = inp.value.trim().toLowerCase() !== state.team.trim().toLowerCase();
  $("#ng-no").onclick = () => dlg.close();
  yes.onclick = () => {
    try { localStorage.removeItem(CONFIG.storageKey); } catch(e){}
    dlg.close(); state = null;
    ui = { tab:"guide", doc:null, char:"marianne", form:null, busy:false, bridgeQueue:[], err:"" };
    render(); scrollTo(0,0);
  };
  inp.focus();
}
function openDoc(id){
  ui.doc = id;
  if (!state.docsOpened[id]){ state.docsOpened[id] = Date.now(); save(); }
  const d = DOCS.find(x => x.id === id);
  render(); scrollTo(0,0);
  if (d.bridge) queueBridge(d.bridge);
}
function unlockEvent(){
  state.eventUnlocked = true; state.eventAt = Date.now(); save();
  ui.tab = "files"; openDoc("D_COAT");
  queueBridge("BC_CONFIRM");
}
function saveEntry(){
  const f = ui.form, val = id => ($(id)?.value || "").trim(), err = m => { $("#f-err").textContent = m; };
  const n = state.log.filter(e => e.type===f.type).length + 1;
  const e = { id:"e"+state.seq, type:f.type, n, ts:Date.now() };
  if (f.type === "hyp"){
    const who = val("#h-who"), motive = val("#h-motive"), means = val("#h-means"), opp = val("#h-opp"), expl = val("#h-expl");
    if (!who) return err("Name a person, or choose one of the other options.");
    if (means.length < 8 || opp.length < 8) return err("Describe the means and the opportunity. Those are what your predictions will come from.");
    e.fields = { who, motive, means, opportunity:opp, explains:expl };
    e.text = [who + ".", motive && "Motive: " + motive, "Means: " + means, "Opportunity: " + opp, expl && "Explains: " + expl].filter(Boolean).join("\n");
    e.status = "open";
  } else {
    const text = val("#f-text");
    if (text.length < 8) return err("Write at least a sentence.");
    e.link = val("#f-link");
    if (f.type === "pred"){
      const doubt = val("#p-doubt");
      e.disc = $("#p-disc").checked;
      e.text = text + "\nWhere: " + val("#p-src") + "." + (doubt ? "\nIf not found: " + doubt : "");
    } else {
      const pat = val("#t-pattern");
      e.evidence = [...document.querySelectorAll(".f-ev:checked")].map(x => x.value);
      e.outcome = val("#f-out");
      if (pat) e.pattern = pat;
      e.text = text + (pat ? "\nPattern relied on: " + pat : "");
    }
  }
  state.seq++;
  const before = tier();
  state.log.push(e); ui.form = null; save(); render();
  if (f.type === "hyp" && counts().h === 2) queueBridge("BC_ABDUCT");
  if (tier() > before) flash(`New files released in Case files.`);
}
function flash(msg){
  const b = $("#banner"); if (!b) return;
  b.innerHTML = `<div class="banner"><div>${esc(msg)}</div></div>`;
  setTimeout(() => { if (b.innerHTML.includes(esc(msg))) b.innerHTML = ""; tick(); }, 6000);
}

/* ---------- bridge cards ---------- */
function queueBridge(id){
  if (state.bridge[id] || ui.bridgeQueue.includes(id)) return;
  ui.bridgeQueue.push(id);
  if (!$("#bridge").open) showBridge();
}
function showBridge(){
  const id = ui.bridgeQueue[0]; if (!id) return;
  const b = BRIDGES[id], dlg = $("#bridge");
  dlg.innerHTML = `<div class="dlg t-${b.kind}">
    <p class="kind">${KIND_INF[b.kind][0].toUpperCase()+KIND_INF[b.kind].slice(1)}</p>
    <h2>${esc(b.title)}</h2><p>${esc(b.text)}</p>
    <p class="research small">${esc(b.research)}</p>
    <label class="field"><span>${esc(b.question)}</span><textarea id="b-ans"></textarea><div class="hint">Discuss it as a team and write your answer. You can continue once you have written a sentence.</div></label>
    <button class="btn primary" id="b-save" disabled>Save and continue</button></div>`;
  dlg.showModal();
  const ta = $("#b-ans"), btn = $("#b-save");
  ta.oninput = () => btn.disabled = ta.value.trim().length < 15;
  btn.onclick = () => {
    state.bridge[id] = { answer: ta.value.trim(), ts: Date.now() }; save();
    ui.bridgeQueue.shift(); dlg.close();
    if (ui.bridgeQueue.length) showBridge();
  };
}
$("#bridge").addEventListener("cancel", e => e.preventDefault());

/* ---------- interviews ---------- */
function matchTopic(c, q){
  const s = q.toLowerCase(); let best = null, score = 0;
  for (const t of c.topics){ const k = t.keywords.filter(w => s.includes(w)).length; if (k > score){ score = k; best = t; } }
  return best;
}
async function ask(charId, question){
  const c = CHARACTERS.find(x => x.id === charId);
  const chat = state.chats[charId] = state.chats[charId] || [];
  chat.push({ role:"user", content:question });
  ui.busy = true; save(); render();
  const topic = matchTopic(c, question);
  const unlocked = topic ? met(topic.requires) : true;
  const variant = topic ? (unlocked ? topic : (topic.locked || null)) : null;
  let reply;
  try {
    reply = (state.mode === "ai" && engine) ? await aiReply(c, variant, question) : scripted(c, variant);
  } catch(e){
    console.error(e); reply = scripted(c, variant);
  }
  chat.push({ role:"assistant", content:reply });
  if (variant?.testimony && !state.testimonies[variant.testimony.id]) state.testimonies[variant.testimony.id] = { ...variant.testimony, ts:Date.now() };
  ui.busy = false; save(); render(); $("#q")?.focus();
}
function scripted(c, v){ return v ? v.line : c.deflections[Math.floor(Math.random()*c.deflections.length)]; }

async function aiReply(c, v, question){
  const brief = v ? v.brief : "The question is not about anything specific you know. Answer briefly in character. Do not invent anything about times, places, evidence or other people's movements; say you don't know if needed.";
  const allowed = new Set([...times(c.facts), ...times(brief)]);
  const lower = question.toLowerCase();
  const rumours = state.emergent.filter(e => e.who === c.id || lower.includes(nameOf(e.who).split(" ")[0].toLowerCase())).slice(-6);
  let system = `You are ${c.name}, ${c.role}, being questioned by investigators the morning after Viktor Lund was poisoned at Kragsholm Manor. He died in hospital during the night.

PERSONALITY: ${c.persona}

WHAT YOU KNOW:
${c.facts}

HOW TO ANSWER THIS QUESTION: ${brief}
${rumours.length ? "\nTHINGS ALREADY SAID IN EARLIER CONVERSATIONS (stay consistent):\n" + rumours.map(r => `- ${nameOf(r.who)}: ${r.text}`).join("\n") : ""}

RULES:
- Speak in the first person as ${c.name.split(" ")[0]}, in English, 1 to 4 sentences of natural spoken dialogue.
- Only mention clock times that appear above. Never invent new evidence, times, movements of people, or facts about drinks, medication, keycards or the study.
- You may add small personal colour: feelings, opinions, memories of your own life.
- Never name a murderer and never confess to anything.

Reply with JSON only, in this form: {"reply": "what you say", "new_details": ["any personal detail you invented, written in the third person"]}. new_details may be empty.`;
  const history = (state.chats[c.id] || []).slice(-9, -1).map(m => ({ role:m.role, content:m.content }));
  for (let attempt = 0; attempt < 2; attempt++){
    const messages = [{ role:"system", content:system }, ...history, { role:"user", content:question }];
    let raw;
    try {
      const r = await engine.chat.completions.create({ messages, temperature:0.7, max_tokens:260, response_format:{ type:"json_object" } });
      raw = r.choices[0].message.content;
    } catch(e){
      const r = await engine.chat.completions.create({ messages, temperature:0.7, max_tokens:260 });
      raw = r.choices[0].message.content;
    }
    const out = parse(raw);
    const problem = check(out.reply, c, allowed);
    if (!problem){ keepDetails(c, out.new_details); return out.reply; }
    system += `\n\nYour previous answer broke a rule (${problem}). Answer again and keep strictly to what you know.`;
  }
  return scripted(c, v);
}
function parse(raw){
  let obj = null;
  try { obj = JSON.parse(raw); } catch(e){ const m = String(raw).match(/\{[\s\S]*\}/); if (m) try { obj = JSON.parse(m[0]); } catch(e2){} }
  if (!obj || typeof obj.reply !== "string") obj = { reply:String(raw).replace(/[{}"]/g,"").trim(), new_details:[] };
  obj.reply = obj.reply.trim().slice(0, 700);
  if (!Array.isArray(obj.new_details)) obj.new_details = [];
  return obj;
}
function check(reply, c, allowed){
  if (!reply || reply.length < 2) return "empty answer";
  for (const re of [...GLOBAL_FORBIDDEN, ...(c.forbidden||[])]) if (re.test(reply)) return "said something the character would never say";
  for (const t of times(reply)) if (!allowed.has(t)) return `mentioned the time ${t}, which you do not know`;
  return null;
}
function keepDetails(c, list){
  for (const d of list.slice(0,2)){
    if (typeof d !== "string") continue;
    const s = d.trim();
    if (s.length < 8 || s.length > 160 || PROTECTED.test(s)) continue;
    if (state.emergent.some(e => e.text.toLowerCase() === s.toLowerCase())) continue;
    state.emergent.push({ who:c.id, text:s, ts:Date.now() });
  }
  if (state.emergent.length > 40) state.emergent = state.emergent.slice(-40);
}

/* ---------- final submission ---------- */
function submitFinal(){
  const v = id => $(id).value.trim();
  const acc = v("#acc");
  const fields = { hypothesis:v("#a-hyp"), deduction:v("#a-ded"), induction:v("#a-ind"), alternatives:v("#a-alt"), uncertainty:v("#a-unc") };
  if (!acc){ $("#finerr").textContent = "Choose who you accuse, or Undecided."; return; }
  if (Object.values(fields).some(x => x.length < 10)){ $("#finerr").textContent = "Write something in every section, even if it is short."; return; }
  if (!confirm("Submit your final argument? You cannot change it afterwards.")) return;
  state.submitted = {
    game:"nightcap", version:1, team:state.team, submittedAt:new Date().toISOString(),
    minutes:Math.round(elapsedMin()), mode:state.mode, model:state.modelId,
    accused:acc, confidence:Number(v("#conf")), argument:fields,
    log:state.log.map(({id,type,n,text,link,status,evidence,outcome,fields,disc,pattern}) => ({id,type,n,text,link,status,evidence,outcome,fields,disc,pattern})),
    bridge:state.bridge, docs:Object.keys(state.docsOpened), testimonies:Object.keys(state.testimonies),
    event:state.eventUnlocked, emergent:state.emergent.map(e => ({ who:e.who, text:e.text })), counts:counts()
  };
  save();
  if (CONFIG.googleForm.action && CONFIG.googleForm.entryId){
    const body = new URLSearchParams(); body.append(CONFIG.googleForm.entryId, JSON.stringify(state.submitted));
    fetch(CONFIG.googleForm.action, { method:"POST", mode:"no-cors", body }).catch(() => {});
  }
  render();
}
function download(){
  const blob = new Blob([JSON.stringify(state.submitted, null, 1)], { type:"application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "nightcap-" + state.team.replace(/[^\w-]+/g,"_") + ".json";
  document.body.appendChild(a); a.click(); a.remove();
}

/* ---------- clock ---------- */
function tick(){
  if (!state) return;
  const m = elapsedMin(), el = $("#clock");
  if (el){ const s = Math.floor(m*60); el.textContent = `${String(Math.floor(s/60)).padStart(2,"0")}:${String(s%60).padStart(2,"0")} of ${CONFIG.sessionMinutes}:00`; }
  const b = $("#banner");
  if (b && !b.innerHTML && !state.submitted){
    if (m >= CONFIG.sessionMinutes) b.innerHTML = `<div class="banner"><div>Time is up. Submit your final argument now.</div></div>`;
    else if (m >= CONFIG.finalCallMinute) b.innerHTML = `<div class="banner"><div>Start writing your final argument. You have about ${Math.ceil(CONFIG.sessionMinutes - m)} minutes.</div></div>`;
  }
}
setInterval(tick, 1000);
render();
</script>
